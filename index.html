<script>
/* ==================================================================================================
   AKI's POONA COLLEGE – ONLINE FEE PAYMENT SYSTEM  (Single-file interactive demo)
   ==================================================================================================
   ARCHITECTURE NOTE (READ THIS):
   ------------------------------
   This single HTML file demonstrates BOTH portals (Student + Teacher/Admin) with a fully working UI.
   Because an iframe demo cannot run Node.js/PostgreSQL, the "backend" below (`Server` object) is a
   SIMULATED server layer that mirrors the REAL API contract of the production project:

       /project
       ├── server.js               ← Express server (auth, rate-limit, helmet, routes)
       ├── package.json
       ├── .env.example            ← DATABASE_URL, PAYMENT_GATEWAY_KEY_ID, PAYMENT_GATEWAY_KEY_SECRET,
       │                              PAYMENT_WEBHOOK_SECRET, TEACHER_ADMIN_SECRET, SESSION_SECRET
       ├── public/  (index.html, student.html, teacher.html, login.html, css/, js/, assets/)
       ├── routes/  (auth.js, students.js, fees.js, payments.js, receipts.js)
       └── database/ (schema.sql, README.md)

   SECURITY RULES ENFORCED IN THIS DEMO (and required in production):
     • The Student UI NEVER receives payment_settings (UPI destination / gateway keys). Only the
       server builds the payment QR/intent from its configuration → `Server.createOrder()`.
     • There is NO "Payment Successful" button for the student. Status changes from PENDING → PAID
       ONLY via `Server.webhook()`, which verifies an HMAC-SHA256 signature against the webhook secret,
       checks amount & order, and is idempotent (duplicate confirmations are ignored).
     • Receipts are generated ONLY after a verified webhook.
     • Passwords are stored as hashes (SHA-256 here for the demo; use bcrypt/argon2 on the server).
     • Gateway mode is "sandbox" until the authorised college adds real credentials on the server.
     • Transaction IDs are never invented by the frontend – they come only from the gateway webhook.
   ================================================================================================== */

/* ------------------------------------------------------------------
   Utilities
------------------------------------------------------------------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = (n) => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtDate = (iso) => { if(!iso) return '—'; const d = new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const fmtDateTime = (iso) => { if(!iso) return '—'; const d = new Date(iso); return fmtDate(iso) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };
const uid = (p='') => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,7).toUpperCase();
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacSha256(secret, message){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(message));
  return [...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, type='info'){
  const colors = { info:'bg-slate-900 text-white', success:'bg-brand-700 text-white', error:'bg-red-600 text-white', warn:'bg-amber-500 text-white' };
  const el = document.createElement('div');
  el.className = `toast pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-sm font-medium max-w-sm ${colors[type]}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='all .3s'; el.style.opacity='0'; el.style.transform='translateY(10px)'; setTimeout(()=>el.remove(), 300); }, 3200);
}

/* ------------------------------------------------------------------
   SIMULATED DATABASE  (mirrors database/schema.sql)
   Tables: users, students, teachers, fees, payments, receipts,
           college_settings, payment_settings
------------------------------------------------------------------- */
const DB_KEY = 'aki_poona_fee_portal_v1';

async function seedDatabase(){
  // DEMO TEST DATA (as requested in the project brief)
  return {
    college_settings: {
      name: "AKI's Poona College",
      tagline: 'Online Fee Payment System',
      logo_text: 'APC',
      address: 'Camp, Pune, Maharashtra – 411001',
      phone: '+91 20 0000 0000',
      email: 'accounts@akipoonacollege.edu.in',
      website: 'www.akipoonacollege.edu.in'
    },
    // SERVER-ONLY. Never sent to student clients.
    payment_settings: {
      upi_id: '8983503264@fam',                 // configured test destination (Teacher/Admin editable)
      payee_name: "AKI's Poona College",
      gateway_provider: 'Razorpay / PhonePe PG (authorised)',
      gateway_mode: 'sandbox',                  // 'sandbox' | 'live'
      gateway_key_id: 'rzp_test_XXXXXXXXXXXX',   // ← replace with authorised college TEST key id
      gateway_key_secret_set: true,             // real secret lives ONLY in server .env
      webhook_secret: 'demo_webhook_secret_change_me', // .env PAYMENT_WEBHOOK_SECRET (server-only)
      qr_size: 220
    },
    teachers: [
      { id:'T1', username:'admin', name:'Accounts Admin', role:'admin', password_hash: await sha256('admin123'), active:true }
    ],
    students: [
      { id:'S1', student_id:'STU001', roll_no:'21', name:'Zaid Sayyed', class:'12th', stream:'Commerce', academic_year:'2026-27', mobile:'', active:true, password_hash: await sha256('student123') }
    ],
    fees: [
      { id:'F1', student_id:'S1', fee_type:'Other/Misc Fee', amount:10, due_date:'2026-09-30', description:'Miscellaneous college charges', status:'PENDING', created_at: new Date().toISOString() },
      { id:'F2', student_id:'S1', fee_type:'Other/Misc Fee', amount:660, due_date:'2026-08-31', description:'Sample seed record for UI demonstration', status:'PAID', created_at:'2026-08-01T09:00:00.000Z' }
    ],
    payments: [
      // Sample seed record (clearly marked DEMO-SEED). Real records are created only by the gateway webhook.
      { id:'P1', student_id:'S1', fee_id:'F2', amount:660, order_id:'ORD-DEMO-SEED-0001', transaction_id:'DEMO-SEED-TXN-0001', status:'PAID', payment_method:'UPI (demo seed)', mode:'sandbox', created_at:'2026-08-24T10:10:00.000Z', paid_at:'2026-08-24T10:12:30.000Z' }
    ],
    receipts: [
      { id:'R1', payment_id:'P1', receipt_no:'APC/2026-27/0001', generated_at:'2026-08-24T10:12:31.000Z' }
    ],
    audit_log: []
  };
}

/* ------------------------------------------------------------------
   SIMULATED SERVER LAYER  (mirrors routes/*.js)
   Everything here would be Node/Express + PostgreSQL in production.
------------------------------------------------------------------- */
const Server = {
  db: null,
  async init(){
    const raw = localStorage.getItem(DB_KEY);
    this.db = raw ? JSON.parse(raw) : await seedDatabase();
    if(!raw) this.save();
  },
  save(){ localStorage.setItem(DB_KEY, JSON.stringify(this.db)); },
  log(action, by, meta={}){ this.db.audit_log.unshift({ id:uid('LOG'), action, by, meta, at:new Date().toISOString() }); this.db.audit_log = this.db.audit_log.slice(0,200); },
  async resetDemo(){ this.db = await seedDatabase(); this.save(); },

  /* ---------------- routes/auth.js ---------------- */
  async loginStudent(student_id, password){
    await sleep(450); // network latency
    const s = this.db.students.find(x => x.student_id.toLowerCase() === String(student_id).trim().toLowerCase());
    if(!s || !s.active) throw new Error('Invalid Student ID or password.');
    if((await sha256(password)) !== s.password_hash) throw new Error('Invalid Student ID or password.');
    this.log('STUDENT_LOGIN', s.student_id);
    return { role:'student', id:s.id, name:s.name };
  },
  async loginTeacher(username, password){
    await sleep(450);
    const t = this.db.teachers.find(x => x.username.toLowerCase() === String(username).trim().toLowerCase());
    if(!t || !t.active) throw new Error('Invalid credentials.');
    if((await sha256(password)) !== t.password_hash) throw new Error('Invalid credentials.');
    this.log('TEACHER_LOGIN', t.username);
    return { role:'teacher', id:t.id, name:t.name };
  },

  /* ---------------- Public college info (safe for students) ---------------- */
  publicCollege(){ const c = this.db.college_settings; return { name:c.name, tagline:c.tagline, logo_text:c.logo_text, address:c.address, phone:c.phone, email:c.email, website:c.website }; },

  /* ---------------- routes/students.js (student-scoped) ---------------- */
  // Authorization: returns ONLY the logged-in student's data. NO payment_settings are included.
  studentView(sessionStudentId){
    const s = this.db.students.find(x => x.id === sessionStudentId);
    if(!s) throw new Error('Unauthorized');
    const { password_hash, ...profile } = s;
    const fees = this.db.fees.filter(f => f.student_id === s.id);
    const payments = this.db.payments.filter(p => p.student_id === s.id);
    const receipts = this.db.receipts.filter(r => payments.some(p => p.id === r.payment_id));
    return { profile, fees, payments, receipts, college: this.publicCollege() };
  },

  /* ---------------- routes/payments.js : POST /api/payments/create-order ---------------- */
  // Server creates a payment ORDER (not a payment). Builds the QR from server-side payment_settings.
  // The student client receives an opaque QR payload + intent URL — never the config itself.
  async createOrder(sessionStudentId, feeId){
    await sleep(600);
    const fee = this.db.fees.find(f => f.id === feeId && f.student_id === sessionStudentId);
    if(!fee) throw new Error('Fee not found or not yours.');
    if(fee.status === 'PAID') throw new Error('This fee is already paid.');
    // Re-use an open order if it exists (prevents duplicate orders)
    let order = this.db.payments.find(p => p.fee_id === fee.id && p.status === 'CREATED');
    if(!order){
      order = { id:uid('P'), student_id:sessionStudentId, fee_id:fee.id, amount:fee.amount, order_id:'ORD' + Date.now() + Math.floor(Math.random()*900+100), transaction_id:null, status:'CREATED', payment_method:null, mode:this.db.payment_settings.gateway_mode, created_at:new Date().toISOString(), paid_at:null };
      this.db.payments.push(order); this.save();
      this.log('ORDER_CREATED', sessionStudentId, { order_id: order.order_id, amount: order.amount });
    }
    const ps = this.db.payment_settings;
    // In production the gateway SDK returns this payload; here the server composes a standard UPI intent.
    const payload = `upi://pay?pa=${encodeURIComponent(ps.upi_id)}&pn=${encodeURIComponent(ps.payee_name)}&am=${Number(fee.amount).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Fee ' + order.order_id)}&tr=${encodeURIComponent(order.order_id)}`;
    return { order_id: order.order_id, amount: order.amount, fee_type: fee.fee_type, qr_payload: payload, intent_url: payload, mode: ps.gateway_mode, qr_size: ps.qr_size, gateway_key_id: ps.gateway_mode === 'live' ? ps.gateway_key_id : undefined };
  },
  // GET /api/payments/status/:orderId  (student polls this; status only changes via webhook)
  orderStatus(sessionStudentId, orderId){
    const p = this.db.payments.find(x => x.order_id === orderId && x.student_id === sessionStudentId);
    if(!p) throw new Error('Order not found');
    const receipt = this.db.receipts.find(r => r.payment_id === p.id);
    return { status: p.status, receipt_id: receipt?.id || null, payment_id: p.id };
  },

  /* ---------------- routes/payments.js : POST /api/payments/webhook ---------------- */
  // THE ONLY PATH THAT CAN MARK A PAYMENT AS PAID.
  // 1) verify HMAC-SHA256 signature with PAYMENT_WEBHOOK_SECRET (server-only)
  // 2) find order, verify amount, ensure idempotency
  // 3) update payments + fees, 4) generate receipt
  async webhook(rawBody, signatureHeader){
    await sleep(400);
    const secret = this.db.payment_settings.webhook_secret;
    const expected = await hmacSha256(secret, rawBody);
    if(!signatureHeader || expected !== String(signatureHeader).trim().toLowerCase()){
      this.log('WEBHOOK_REJECTED_BAD_SIGNATURE', 'gateway');
      return { ok:false, http:401, message:'Invalid webhook signature. Payment NOT updated.' };
    }
    let evt; try { evt = JSON.parse(rawBody); } catch { return { ok:false, http:400, message:'Malformed payload.' }; }
    if(evt.event !== 'payment.captured') return { ok:true, http:200, message:`Event "${evt.event}" acknowledged, no action.` };
    const p = this.db.payments.find(x => x.order_id === evt.order_id);
    if(!p) return { ok:false, http:404, message:'Unknown order_id. Ignored.' };
    if(p.status === 'PAID') return { ok:true, http:200, message:'Duplicate webhook ignored (already PAID).' };
    if(Number(evt.amount) !== Number(p.amount)) { this.log('WEBHOOK_AMOUNT_MISMATCH','gateway',{order_id:p.order_id}); return { ok:false, http:400, message:'Amount mismatch. Flagged for review.' }; }
    if(!evt.transaction_id) return { ok:false, http:400, message:'Missing gateway transaction_id.' };
    if(this.db.payments.some(x => x.transaction_id === evt.transaction_id)) return { ok:false, http:409, message:'transaction_id already used.' };
    // ---- Verified: update DB (transactional in production) ----
    p.status = 'PAID'; p.transaction_id = evt.transaction_id; p.payment_method = evt.method || 'UPI'; p.paid_at = evt.paid_at || new Date().toISOString(); p.mode = this.db.payment_settings.gateway_mode;
    const fee = this.db.fees.find(f => f.id === p.fee_id); if(fee) fee.status = 'PAID';
    const seq = String(this.db.receipts.length + 1).padStart(4,'0');
    const student = this.db.students.find(s => s.id === p.student_id);
    const receipt = { id:uid('R'), payment_id:p.id, receipt_no:`APC/${student?.academic_year || 'NA'}/${seq}`, generated_at:new Date().toISOString() };
    this.db.receipts.push(receipt); this.save();
    this.log('PAYMENT_VERIFIED_PAID', 'gateway', { order_id:p.order_id, transaction_id:p.transaction_id });
    return { ok:true, http:200, message:`Verified. Order ${p.order_id} marked PAID. Receipt ${receipt.receipt_no} generated.` };
  },

  /* ---------------- routes/receipts.js ---------------- */
  receiptView(receiptId, session){
    const r = this.db.receipts.find(x => x.id === receiptId); if(!r) throw new Error('Receipt not found');
    const p = this.db.payments.find(x => x.id === r.payment_id);
    if(session.role === 'student' && p.student_id !== session.id) throw new Error('Unauthorized');
    if(p.status !== 'PAID') throw new Error('Receipt available only for verified payments');
    const s = this.db.students.find(x => x.id === p.student_id);
    const f = this.db.fees.find(x => x.id === p.fee_id);
    return { receipt:r, payment:p, student:s, fee:f, college:this.publicCollege() };
  },

  /* ---------------- Teacher/Admin (authorization: role === 'teacher') ---------------- */
  guard(session){ if(!session || session.role !== 'teacher') throw new Error('Forbidden'); },
  adminView(session){ this.guard(session); const { teachers, ...rest } = this.db; return JSON.parse(JSON.stringify(rest)); },
  upsertStudent(session, data){
    this.guard(session);
    if(!data.name || !data.student_id) throw new Error('Name and Student ID are required');
    const dup = this.db.students.find(s => s.student_id.toLowerCase() === data.student_id.toLowerCase() && s.id !== data.id);
    if(dup) throw new Error('Student ID already exists');
    if(data.id){ const s = this.db.students.find(x => x.id === data.id); Object.assign(s, data); }
    else { this.db.students.push({ id:uid('S'), active:true, ...data }); }
    this.save(); this.log(data.id ? 'STUDENT_UPDATED' : 'STUDENT_ADDED', session.name, { student_id:data.student_id });
  },
  async setStudentPassword(session, id, pw){ this.guard(session); const s = this.db.students.find(x=>x.id===id); if(!s) throw new Error('Not found'); if(!pw || pw.length<6) throw new Error('Min 6 characters'); s.password_hash = await sha256(pw); this.save(); },
  toggleStudent(session, id){ this.guard(session); const s = this.db.students.find(x => x.id === id); s.active = !s.active; this.save(); },
  deleteStudent(session, id){ this.guard(session); if(this.db.payments.some(p => p.student_id === id && p.status === 'PAID')) throw new Error('Student has paid records. Deactivate instead of deleting.'); this.db.students = this.db.students.filter(s => s.id !== id); this.db.fees = this.db.fees.filter(f => f.student_id !== id); this.save(); },
  upsertFee(session, data){
    this.guard(session);
    if(!data.student_id || !data.fee_type || !(Number(data.amount) > 0)) throw new Error('Student, fee type and valid amount are required');
    data.amount = Number(data.amount);
    if(data.id){ const f = this.db.fees.find(x => x.id === data.id); if(f.status === 'PAID') throw new Error('Paid fees cannot be edited'); Object.assign(f, data); }
    else this.db.fees.push({ id:uid('F'), status:'PENDING', created_at:new Date().toISOString(), ...data });
    this.save(); this.log(data.id ? 'FEE_UPDATED' : 'FEE_CREATED', session.name, { fee_type:data.fee_type, amount:data.amount });
  },
  deleteFee(session, id){ this.guard(session); const f = this.db.fees.find(x => x.id === id); if(f.status === 'PAID') throw new Error('Paid fees cannot be deleted'); this.db.fees = this.db.fees.filter(x => x.id !== id); this.db.payments = this.db.payments.filter(p => !(p.fee_id === id && p.status === 'CREATED')); this.save(); },
  saveCollege(session, data){ this.guard(session); Object.assign(this.db.college_settings, data); this.save(); this.log('COLLEGE_SETTINGS_UPDATED', session.name); },
  savePaymentSettings(session, data){
    this.guard(session);
    if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(data.upi_id || '')) throw new Error('Enter a valid UPI ID (e.g. name@bank)');
    Object.assign(this.db.payment_settings, data); this.save(); this.log('PAYMENT_SETTINGS_UPDATED', session.name);
  }
};

function render(){
  const app = $('#app');
  if(App.view === 'student' && (!App.session || App.session.role !== 'student')) App.view = 'student-login';
  if(App.view === 'teacher' && (!App.session || App.session.role !== 'teacher')) App.view = 'teacher-login';
  switch(App.view){
    case 'landing': app.innerHTML = Landing(); break;
    case 'student-login': app.innerHTML = LoginPage('student'); break;
    case 'teacher-login': app.innerHTML = LoginPage('teacher'); break;
    case 'student': app.innerHTML = StudentPortal(); afterStudentRender(); break;
    case 'teacher': app.innerHTML = TeacherPortal(); break;
    default: app.innerHTML = Landing();
  }
}

function studentSummary(data){
  const pending = data.fees.filter(f => f.status === 'PENDING');
  const paid = data.payments.filter(p => p.status === 'PAID');
  return { pending, paid, pendingTotal: pending.reduce((a,f)=>a+Number(f.amount),0), paidTotal: paid.reduce((a,p)=>a+Number(p.amount),0) };
}

function afterStudentRender(){
  if(App.tab === 'checkout' && App.payOrder){
    const el = $('#qrcode');
    if(el){ el.innerHTML = ''; try { new QRCode(el, { text: App.payOrder.qr_payload, width: App.payOrder.qr_size||220, height: App.payOrder.qr_size||220, colorDark:'#0f766e', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch(e){ el.innerHTML = '<div class="text-xs text-slate-500">QR unavailable. Use the button below.</div>'; } }
    // Poll the server for the verified status (webhook-driven). Frontend never sets PAID itself.
    App.stopPolling();
    App.pollTimer = setInterval(()=>{
      try{
        const st = Server.orderStatus(App.session.id, App.payOrder.order_id);
        if(st.status === 'PAID'){ App.stopPolling(); toast('Payment verified by gateway. Receipt generated.', 'success'); const pid = st.payment_id; App.payOrder = null; App.go('student','completed'); openReceipt(pid); }
      }catch(e){ App.stopPolling(); }
    }, 2500);
  }
}

/* ---------------- RECEIPT MODAL ---------------- */
function openReceipt(paymentId){
  const r = Server.db.receipts.find(x => x.payment_id === paymentId);
  if(!r){ toast('Receipt not available until payment is verified.', 'warn'); return; }
  let v; try { v = Server.receiptView(r.id, App.session); } catch(e){ toast(e.message,'error'); return; }
  const { receipt, payment:p, student:s, fee:f, college:c } = v;
  const isTest = p.mode === 'sandbox';

function downloadReceipt(receiptId){
  const html = $('#receipt-print').outerHTML;
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt</title><script src="https://cdn.tailwindcss.com"><\/script><style>body{font-family:Inter,system-ui,sans-serif;padding:24px;max-width:640px;margin:auto}.badge{display:inline-flex;font-size:.72rem;font-weight:700;padding:.28rem .7rem;border-radius:999px}.badge-paid{background:#dcfce7;color:#15803d}.badge-test{background:#ede9fe;color:#6d28d9}.no-print{display:none}.mono{font-family:monospace}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.watermark span{font-size:4rem;font-weight:800;color:rgba(109,40,217,.07);transform:rotate(-24deg)}</style></head><body>${html}</body></html>`;
  const r = Server.db.receipts.find(x=>x.id===receiptId);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc],{type:'text/html'})); a.download = `Receipt-${(r?.receipt_no||'receipt').replace(/\//g,'-')}.html`; a.click(); URL.revokeObjectURL(a.href);
  toast('Receipt saved. Use Print → Save as PDF for a PDF copy.', 'success');
}

function TReports(db){

    <div class="card p-5"><div class="font-bold text-slate-900">Monthly collections</div><div class="mt-4 flex items-end gap-3 h-40">${Object.entries(byMonth).map(([k,v])=>`<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end"><div class="text-[11px] font-semibold text-slate-700">${inr(v)}</div><div class="w-full max-w-[48px] rounded-t-lg bg-gradient-to-t from-brand-700 to-brand-400 transition-all" style="height:${(v/maxM*100).toFixed(0)}%"></div><div class="text-[11px] text-slate-500">${k}</div></div>`).join('')||'<div class="text-sm text-slate-500 m-auto">No verified payments yet.</div>'}</div></div>

      ${ps.gateway_mode!=='sandbox'?`<div class="rounded-xl bg-red-50 border border-red-200 p-3 text-xs text-red-700">Disabled in Live mode. Real webhooks are delivered by the gateway.</div>`:`

/* ---------------- Admin modals ---------------- */
function modal(title, bodyHtml, formId){
  $('#modal-root').innerHTML = `<div class="fixed inset-0 z-[80] modal-bg bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" data-action="close-modal-bg"><div class="modal-box bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[95vh] overflow-y-auto" data-stop><div class="p-5 sm:p-6 flex items-center justify-between border-b border-slate-100"><div class="font-bold text-slate-900">${title}</div><button class="btn btn-ghost p-1.5" data-action="close-modal">✕</button></div><form id="${formId}" class="p-5 sm:p-6 space-y-4">${bodyHtml}</form></div></div>`;
}
function studentModal(id){
  const s = id ? Server.db.students.find(x=>x.id===id) : { student_id:'', roll_no:'', name:'', class:'', stream:'', academic_year:'2026-27', mobile:'' };
  modal(id?'Edit student':'Add student', `
    <input type="hidden" name="id" value="${esc(s.id||'')}">
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2"><label class="label">Student name</label><input class="input" name="name" value="${esc(s.name)}" required></div>
      <div><label class="label">Student ID</label><input class="input mono" name="student_id" value="${esc(s.student_id)}" required></div>
      <div><label class="label">Roll number</label><input class="input" name="roll_no" value="${esc(s.roll_no||'')}"></div>
      <div><label class="label">Class</label><input class="input" name="class" value="${esc(s.class)}" placeholder="12th" required></div>
      <div><label class="label">Stream</label><input class="input" name="stream" value="${esc(s.stream||'')}" placeholder="Commerce"></div>
      <div><label class="label">Academic year</label><input class="input" name="academic_year" value="${esc(s.academic_year)}" required></div>
      <div><label class="label">Mobile (optional)</label><input class="input" name="mobile" value="${esc(s.mobile||'')}" inputmode="tel"></div>
      ${!id?`<div class="sm:col-span-2"><label class="label">Initial password</label><input class="input" name="password" type="text" value="student123" required minlength="6"><div class="text-[11px] text-slate-500 mt-1">Stored as a hash. Student should change it after first login.</div></div>`:''}
    </div>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${id?'Save changes':'Add student'}</button></div>`, 'student-form');
}
function feeModal(id){
  const f = id ? Server.db.fees.find(x=>x.id===id) : { student_id: Server.db.students[0]?.id||'', fee_type:'Other/Misc Fee', amount:'', due_date:'', description:'' };
  modal(id?'Edit fee':'Create fee', `
    <input type="hidden" name="id" value="${esc(f.id||'')}">
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2"><label class="label">Student</label><select class="input" name="student_id" required>${Server.db.students.map(s=>`<option value="${s.id}" ${s.id===f.student_id?'selected':''}>${esc(s.name)} (${esc(s.student_id)})</option>`).join('')}</select></div>
      <div><label class="label">Fee type</label><input class="input" name="fee_type" list="fee-types" value="${esc(f.fee_type)}" required><datalist id="fee-types"><option>Tuition Fee</option><option>Exam Fee</option><option>Library Fee</option><option>Laboratory Fee</option><option>Other/Misc Fee</option></datalist></div>
      <div><label class="label">Amount (₹)</label><input class="input" name="amount" type="number" min="1" step="0.01" value="${esc(f.amount)}" required></div>
      <div><label class="label">Due date</label><input class="input" name="due_date" type="date" value="${esc(f.due_date||'')}"></div>
      <div><label class="label">Status</label><div class="input bg-slate-50 text-slate-500 text-sm">PENDING — becomes PAID only via verified gateway webhook</div></div>
      <div class="sm:col-span-2"><label class="label">Description</label><input class="input" name="description" value="${esc(f.description||'')}"></div>
    </div>
    <div class="flex justify-end gap-2"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${id?'Save changes':'Create fee'}</button></div>`, 'fee-form');
}
function passwordModal(id){
  const s = Server.db.students.find(x=>x.id===id);
  modal(`Reset password — ${esc(s.name)}`, `<input type="hidden" name="id" value="${id}"><div><label class="label">New password</label><input class="input" name="password" type="text" required minlength="6" placeholder="min 6 characters"></div><div class="flex justify-end gap-2"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Set password</button></div>`, 'password-form');
}
function confirmModal(title, msg, onYes){
  modal(title, `<p class="text-sm text-slate-600">${msg}</p><div class="flex justify-end gap-2"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger" type="submit">Confirm</button></div>`, 'confirm-form');
  $('#confirm-form').addEventListener('submit', e=>{ e.preventDefault(); closeModal(); onYes(); });
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function exportCSV(){
  const db = Server.adminView(App.session);
  const rows = [['Receipt No','Student','Student ID','Fee Type','Amount','Order ID','Transaction ID','Method','Paid At','Mode']];
  db.payments.filter(p=>p.status==='PAID').forEach(p=>{ const s=db.students.find(x=>x.id===p.student_id)||{}; const f=db.fees.find(x=>x.id===p.fee_id)||{}; const r=db.receipts.find(x=>x.payment_id===p.id)||{}; rows.push([r.receipt_no||'',s.name||'',s.student_id||'',f.fee_type||'',p.amount,p.order_id,p.transaction_id,p.payment_method||'',p.paid_at,p.mode||'']); });
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'completed-payments.csv'; a.click(); toast('CSV exported.', 'success');
}

/* ==================================================================
   EVENT HANDLING (delegated)
================================================================== */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]'); if(!t) return;
  const a = t.dataset.action;
  if(a === 'close-modal-bg'){ if(e.target === t) closeModal(); return; }
  if(a === 'close-drawer'){ if(e.target === t){ App.drawerOpen=false; render(); } return; }
  switch(a){
    case 'go': App.go(t.dataset.view, t.dataset.view==='landing'?'home':undefined); break;
    case 'tab': App.tab = t.dataset.tab; sessionStorage.setItem('aki_tab', App.tab); App.stopPolling(); App.drawerOpen=false; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'logout': App.logout(); break;
    case 'toggle-pass': { const inp = t.parentElement.querySelector('input'); inp.type = inp.type==='password'?'text':'password'; t.textContent = inp.type==='password'?'Show':'Hide'; break; }
    case 'checkout': {
      t.disabled = true; t.innerHTML = '<span class="spinner"></span> Creating order…';
      try { App.payOrder = await Server.createOrder(App.session.id, t.dataset.fee); App.tab='checkout'; render(); }
      catch(err){ toast(err.message,'error'); render(); }
      break; }
    case 'receipt': openReceipt(t.dataset.payment); break;
    case 'print': window.print(); break;
    case 'download-receipt': downloadReceipt(t.dataset.receipt); break;
    case 'close-modal': closeModal(); break;
    case 'open-drawer': App.drawerOpen = true; render(); break;
    case 'edit-student': studentModal(t.dataset.id); break;
    case 'student-pass': passwordModal(t.dataset.id); break;
    case 'toggle-student': Server.toggleStudent(App.session, t.dataset.id); toast('Student status updated.','success'); render(); break;
    case 'delete-student': confirmModal('Delete student?', 'This removes the student and their unpaid fees. Students with verified payments cannot be deleted (deactivate instead).', ()=>{ try{ Server.deleteStudent(App.session, t.dataset.id); toast('Student deleted.','success'); }catch(err){ toast(err.message,'error'); } render(); }); break;
    case 'edit-fee': feeModal(t.dataset.id); break;
    case 'delete-fee': confirmModal('Delete fee?', 'This pending fee item will be removed permanently.', ()=>{ try{ Server.deleteFee(App.session, t.dataset.id); toast('Fee deleted.','success'); }catch(err){ toast(err.message,'error'); } render(); }); break;
    case 'export-csv': exportCSV(); break;
    case 'reset-demo': confirmModal('Reset demo data?', 'All students, fees, payments and settings return to the initial test data.', async ()=>{ await Server.resetDemo(); toast('Demo data reset.','success'); render(); }); break;
  }
});

document.addEventListener('input', (e) => {
  if(e.target.dataset.action === 'search-students'){ const q = e.target.value.toLowerCase(); document.querySelectorAll('#students-table tbody tr').forEach(tr => tr.style.display = tr.dataset.search.includes(q) ? '' : 'none'); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target; const fd = Object.fromEntries(new FormData(f).entries());
  if(f.id === 'login-form'){
    e.preventDefault(); const btn = $('#login-btn'), err = $('#login-err'); btn.disabled = true; btn.innerHTML = '<span class="spinner border-white/40 border-t-white"></span> Signing in…'; err.classList.add('hidden');
    try { const s = f.dataset.role === 'teacher' ? await Server.loginTeacher(fd.user, fd.pass) : await Server.loginStudent(fd.user, fd.pass); App.setSession(s); toast(`Welcome, ${s.name}!`, 'success'); App.go(s.role==='teacher'?'teacher':'student', s.role==='teacher'?'dashboard':'home'); }
    catch(ex){ err.textContent = ex.message; err.classList.remove('hidden'); btn.disabled=false; btn.textContent='Sign in'; }
    return;
  }
  if(f.id === 'student-form'){ e.preventDefault(); try { const pw = fd.password; delete fd.password; if(!fd.id) delete fd.id; Server.upsertStudent(App.session, fd); if(pw){ const s = Server.db.students.find(x=>x.student_id===fd.student_id); await Server.setStudentPassword(App.session, s.id, pw); } toast('Student saved.','success'); closeModal(); render(); } catch(ex){ toast(ex.message,'error'); } return; }
  if(f.id === 'fee-form'){ e.preventDefault(); try { if(!fd.id) delete fd.id; Server.upsertFee(App.session, fd); toast('Fee saved.','success'); closeModal(); render(); } catch(ex){ toast(ex.message,'error'); } return; }
  if(f.id === 'password-form'){ e.preventDefault(); try { await Server.setStudentPassword(App.session, fd.id, fd.password); toast('Password updated.','success'); closeModal(); } catch(ex){ toast(ex.message,'error'); } return; }
  if(f.id === 'college-form'){ e.preventDefault(); try { Server.saveCollege(App.session, fd); toast('College settings saved.','success'); render(); } catch(ex){ toast(ex.message,'error'); } return; }
  if(f.id === 'payment-settings-form'){ e.preventDefault(); try { fd.qr_size = Number(fd.qr_size)||220; Server.savePaymentSettings(App.session, fd); toast('Payment settings saved (server-side).','success'); render(); } catch(ex){ toast(ex.message,'error'); } return; }
  if(f.id === 'webhook-form'){
    e.preventDefault();
    // This simulates the GATEWAY (not the student) delivering a signed event to the backend.
    const order = Server.db.payments.find(p=>p.order_id===fd.order_id);
    const body = JSON.stringify({ event:'payment.captured', order_id:fd.order_id, amount:order?.amount, transaction_id:fd.transaction_id, method:fd.method, paid_at:new Date().toISOString() });
    const signature = fd.sigmode === 'valid' ? await hmacSha256(Server.db.payment_settings.webhook_secret, body) : 'deadbeef'.repeat(8);
    const out = $('#webhook-result'); out.classList.remove('hidden'); out.className = 'rounded-xl p-3 text-xs mono break-all bg-slate-100 text-slate-600'; out.textContent = 'POST /api/payments/webhook … verifying signature';
    const res = await Server.webhook(body, signature);
    out.className = `rounded-xl p-3 text-xs mono break-all ${res.ok?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-red-50 text-red-700 border border-red-200'}`;
    out.textContent = `HTTP ${res.http} — ${res.message}`;
    toast(res.message, res.ok ? 'success' : 'error');
    if(res.ok && res.message.startsWith('Verified')) setTimeout(render, 1500);
    return;
  }
});

/* ==================================================================
   BOOT
================================================================== */
(async function boot(){
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center bg-brand-50"><div class="text-center"><div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-brand-500 to-brand-800 text-white font-extrabold grid place-items-center shadow-lg">APC</div><div class="mt-4 flex items-center gap-2 justify-center text-sm text-slate-600"><span class="spinner"></span> Loading portal…</div></div></div>`;
  await Server.init();
  render();
})();
